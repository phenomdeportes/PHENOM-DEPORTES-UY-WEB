<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phenom | Tienda Oficial</title>
    <style>
        /* --- RESET Y VARIABLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { overflow-x: hidden; background: #fff; }

        /* --- BARRA SUPERIOR --- */
        .top-bar { background-color: #000; color: #fff; text-align: center; padding: 10px; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; }

        /* --- HEADER PRINCIPAL --- */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: #fff; border-bottom: 1px solid #eaeaea; transition: padding 0.3s ease; }
        .logo-container img { height: 45px; cursor: pointer; transition: all 0.3s ease; }
        
        /* NAVEGACIÓN */
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-item-container { position: relative; display: flex; align-items: center; gap: 5px; }
        .nav-links a { text-decoration: none; color: #000; font-weight: 700; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; transition: color 0.2s; }
        .nav-links a:hover { color: #666; }
        .btn-nav-add { display: none; background: #000; color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 12px; font-weight: bold; cursor: pointer; align-items: center; justify-content: center; }
        
        .header-icons { display: flex; align-items: center; gap: 20px; }
        .search-box { background: #f0f0f0; border: none; padding: 10px 15px; border-radius: 4px; font-size: 13px; width: 180px; outline: none; }
        .icon { font-size: 20px; cursor: pointer; }

        /* --- HERO SECTION --- */
        .hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); height: 85vh; }
        .hero-col { position: relative; background-color: #111; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #fff; }
        .hero-col::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); }
        .hero-content { position: relative; z-index: 1; padding: 20px; width: 100%; }
        .hero-title { font-size: 2.8rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; }
        .hero-subtitle { font-size: 1.5rem; font-weight: 700; text-transform: uppercase; margin-bottom: 25px; }
        .btn-comprar { display: inline-flex; align-items: center; background: #fff; color: #000; padding: 15px 30px; font-weight: 900; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; }
        .btn-comprar:hover { background: #000; color: #fff; }

        /* --- CARRUSEL HORIZONTAL --- */
        .carousel-section { padding: 40px; background: #fff; max-width: 100vw; }
        .carousel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eaeaea; padding-bottom: 10px; margin-bottom: 20px; }
        .carousel-tabs button { background: none; border: 1px solid transparent; font-size: 16px; font-weight: 900; padding: 10px 20px; cursor: pointer; text-transform: uppercase; }
        .carousel-tabs button.active { background: #000; color: #fff; border: 1px solid #000; }
        .carousel-actions { display: flex; align-items: center; gap: 15px; }
        .view-all { color: #000; text-decoration: underline; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .carousel-track { display: flex; gap: 20px; overflow-x: auto; scroll-behavior: smooth; padding-bottom: 20px; align-items: stretch; }
        .carousel-track::-webkit-scrollbar { display: none; }
        .card-mini { min-width: 280px; max-width: 280px; flex-shrink: 0; cursor: pointer; position: relative; }
        .card-img-container { position: relative; background: #f4f4f4; height: 280px; display: flex; justify-content: center; align-items: center; }
        .card-img-container img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .card-price-tag { position: absolute; bottom: 0; left: 10px; background: #fff; padding: 5px 10px; font-weight: 900; font-size: 14px; }
        .card-info { padding-top: 15px; }
        .card-title { font-size: 13px; color: #000; font-weight: 400; margin-bottom: 3px; }
        .card-sizes { font-size: 11px; color: #666; margin-top: 5px; font-weight: bold; }

        /* --- MODO ADMINISTRADOR (VISIBILIDAD CONTROLADA) --- */
        .admin-only { display: none; }
        body.admin-mode .admin-only { display: block; }
        body.admin-mode .admin-flex { display: flex; }
        body.admin-mode .btn-nav-add { display: flex; }

        .edit-card-btn { position: absolute; top: 10px; left: 10px; z-index: 10; background: #e00; color: #fff; border: none; padding: 5px 10px; font-size: 11px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        /* --- PANEL DE EDICIÓN OCULTO (MÓDULO OMEGA) --- */
        #admin-panel { display: none; position: fixed; top: 0; right: 0; width: 350px; height: 100vh; background: #f4f4f4; border-left: 2px solid #000; padding: 20px; z-index: 9999; overflow-y: auto; box-shadow: -5px 0 15px rgba(0,0,0,0.3); }
        #admin-panel.active { display: block; }
        .admin-header { font-weight: 900; font-size: 16px; margin-bottom: 20px; text-transform: uppercase; border-bottom: 2px solid #000; padding-bottom: 10px;}
        .admin-group { margin-bottom: 15px; }
        .admin-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; color: #333; }
        .admin-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; }
        .btn-save { background: #000; color: #fff; width: 100%; padding: 15px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-close { background: #e00; color: #fff; border: none; padding: 5px 10px; cursor: pointer; font-weight: bold; float: right; }
        #toast-success { position: fixed; top: 20px; right: 20px; background: #000; color: #ede734; padding: 15px 25px; font-weight: 900; border-radius: 4px; z-index: 10000; display: none; text-transform: uppercase; font-size: 12px; }

        /* --- MODAL DE PRODUCTO (EDICIÓN / NUEVO) --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #fff; padding: 30px; width: 400px; max-width: 90%; border-radius: 0; border: 2px solid #000; position: relative; }
        .modal-title { font-weight: 900; font-size: 18px; text-transform: uppercase; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        .modal-close { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 20px; font-weight: bold; cursor: pointer; }
        
        .size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 5px; }
        .size-item { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <div class="top-bar" id="fub-bar">
        ¡BIENVENIDOS A LA TIENDA OFICIAL DE PHENOM!
    </div>

    <!-- HEADER -->
    <header class="header" id="main-header">
        <div class="logo-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/Adidas_Logo.svg/2560px-Adidas_Logo.svg.png" alt="Logo" id="logo-trigger">
        </div>
        
        <nav class="nav-links">
            <div class="nav-item-container">
                <a href="#">Protectores</a>
                <button class="btn-nav-add" onclick="openProductModal('Protectores')">+</button>
            </div>
            <div class="nav-item-container">
                <a href="#">Accesorios</a>
                <button class="btn-nav-add" onclick="openProductModal('Accesorios')">+</button>
            </div>
            <div class="nav-item-container">
                <a href="#">Implementos</a>
                <button class="btn-nav-add" onclick="openProductModal('Implementos')">+</button>
            </div>
            <div class="nav-item-container">
                <a href="#">Packs</a>
                <button class="btn-nav-add" onclick="openProductModal('Packs')">+</button>
            </div>
        </nav>

        <div class="header-icons">
            <input type="text" class="search-box" placeholder="Buscar...">
            <span class="icon">🛒</span>
        </div>
    </header>

    <!-- CARRUSEL DE PRODUCTOS -->
    <section class="carousel-section">
        <div class="carousel-header">
            <div class="carousel-tabs">
                <button class="active">Inventario Actual</button>
            </div>
        </div>
        
        <div class="carousel-track" id="inventory-track">
            <!-- Producto Base de Ejemplo -->
            <div class="card-mini">
                <button class="edit-card-btn admin-only" onclick="openProductModal('Editar', this)">Editar</button>
                <div class="card-img-container">
                    <img src="https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?q=80&w=400" alt="Guante Phenom">
                    <div class="card-price-tag" data-raw-price="2250">$ 2.250,00</div>
                </div>
                <div class="card-info">
                    <h3 class="card-title">Guantes Boxeo Phenom Pro Violeta</h3>
                    <p class="card-sizes">Talles: 14oz, 16oz</p>
                </div>
            </div>
        </div>
    </section>

    <!-- PANEL DE EDICIÓN OCULTO -->
    <div id="admin-panel">
        <button class="btn-close" onclick="toggleAdminMode(false)">X</button>
        <div class="admin-header">Control Omega</div>
        
        <div class="admin-group">
            <label>Subir Nuevo Logo</label>
            <input type="file" id="edit-logo-file" accept="image/*">
        </div>
        <div class="admin-group">
            <label>Tamaño del Logo (px)</label>
            <input type="range" id="edit-logo-size" min="20" max="150" value="45">
        </div>
        <div class="admin-group">
            <label>Altura de la Barra (Padding px)</label>
            <input type="range" id="edit-header-pad" min="5" max="50" value="15">
        </div>
        <div class="admin-group">
            <label>Texto Barra Superior</label>
            <input type="text" id="edit-fub-bar">
        </div>
        
        <button class="btn-save" onclick="saveAllSettings()">GUARDAR CAMBIOS</button>
    </div>

    <!-- MODAL DE CREACIÓN/EDICIÓN DE PRODUCTO -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeProductModal()">X</button>
            <div class="modal-title" id="modal-title-text">NUEVO PRODUCTO</div>
            
            <div class="admin-group">
                <label>Título del Producto</label>
                <input type="text" id="modal-prod-title" placeholder="Ej: Guantes Phenom Elite">
            </div>
            <div class="admin-group">
                <label>Precio Actual ($)</label>
                <input type="number" id="modal-prod-price" placeholder="2250">
            </div>
            
            <div class="admin-group">
                <label>Talles / Onzas Disponibles</label>
                <div class="size-grid">
                    <label class="size-item"><input type="checkbox" value="S" class="size-check"> S</label>
                    <label class="size-item"><input type="checkbox" value="M" class="size-check"> M</label>
                    <label class="size-item"><input type="checkbox" value="L" class="size-check"> L</label>
                    <label class="size-item"><input type="checkbox" value="8oz" class="size-check"> 8oz</label>
                    <label class="size-item"><input type="checkbox" value="10oz" class="size-check"> 10oz</label>
                    <label class="size-item"><input type="checkbox" value="12oz" class="size-check"> 12oz</label>
                    <label class="size-item"><input type="checkbox" value="14oz" class="size-check"> 14oz</label>
                    <label class="size-item"><input type="checkbox" value="16oz" class="size-check"> 16oz</label>
                </div>
            </div>

            <button class="btn-save" onclick="saveProduct()">APLICAR AL INVENTARIO</button>
        </div>
    </div>

    <div id="toast-success">¡CAMBIOS GUARDADOS CON ÉXITO! ✓</div>

    <!-- SCRIPT DE MOTOR LÓGICO -->
    <script>
        // --- 1. LÓGICA GATILLO Y MODO ADMINISTRADOR ---
        let clickCount = 0;
        let clickTimer;
        const logoTrigger = document.getElementById('logo-trigger');
        const adminPanel = document.getElementById('admin-panel');
        const header = document.getElementById('main-header');

        function toggleAdminMode(forceState) {
            if (forceState) {
                adminPanel.classList.add('active');
                document.body.classList.add('admin-mode');
            } else {
                adminPanel.classList.remove('active');
                document.body.classList.remove('admin-mode');
            }
        }

        logoTrigger.addEventListener('click', () => {
            clickCount++;
            clearTimeout(clickTimer);
            if (clickCount === 5) { toggleAdminMode(true); clickCount = 0; } 
            else { clickTimer = setTimeout(() => { clickCount = 0; }, 2000); }
        });

        // --- 2. CONTROLES EN VIVO (LOGO Y BARRA) ---
        document.getElementById('edit-logo-size').addEventListener('input', e => {
            logoTrigger.style.height = e.target.value + 'px';
        });
        document.getElementById('edit-header-pad').addEventListener('input', e => {
            header.style.padding = `${e.target.value}px 40px`;
        });
        document.getElementById('edit-logo-file').addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = event => {
                    const base64 = event.target.result;
                    logoTrigger.src = base64;
                    logoTrigger.dataset.customLogo = base64; 
                };
                reader.readAsDataURL(file);
            }
        });

        // --- 3. LÓGICA DEL MODAL DE PRODUCTO ---
        const productModal = document.getElementById('product-modal');
        let currentEditingCard = null;

        function openProductModal(actionContext, cardElement = null) {
            document.getElementById('modal-title-text').innerText = cardElement ? "EDITAR PRODUCTO" : `NUEVO PRODUCTO: ${actionContext.toUpperCase()}`;
            currentEditingCard = cardElement;
            
            // Limpiar Modal
            document.getElementById('modal-prod-title').value = '';
            document.getElementById('modal-prod-price').value = '';
            document.querySelectorAll('.size-check').forEach(cb => cb.checked = false);

            // Si es edición, chupar los datos de la tarjeta
            if (cardElement) {
                document.getElementById('modal-prod-title').value = cardElement.querySelector('.card-title').innerText;
                document.getElementById('modal-prod-price').value = cardElement.querySelector('.card-price-tag').getAttribute('data-raw-price') || '';
                
                const sizesText = cardElement.querySelector('.card-sizes').innerText;
                document.querySelectorAll('.size-check').forEach(cb => {
                    if (sizesText.includes(cb.value)) cb.checked = true;
                });
            }
            productModal.classList.add('active');
        }

        function closeProductModal() { productModal.classList.remove('active'); }

        function saveProduct() {
            const title = document.getElementById('modal-prod-title').value || 'Sin Título';
            const price = parseFloat(document.getElementById('modal-prod-price').value || 0);
            const formattedPrice = `$ ${price.toLocaleString('es-UY', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            
            const sizes = Array.from(document.querySelectorAll('.size-check:checked')).map(cb => cb.value).join(', ');
            const sizeString = sizes ? `Talles: ${sizes}` : 'Consultar disponibilidad';

            if (currentEditingCard) {
                // Actualizar tarjeta existente
                currentEditingCard.querySelector('.card-title').innerText = title;
                currentEditingCard.querySelector('.card-price-tag').innerText = formattedPrice;
                currentEditingCard.querySelector('.card-price-tag').setAttribute('data-raw-price', price);
                currentEditingCard.querySelector('.card-sizes').innerText = sizeString;
            } else {
                // Crear nueva tarjeta (Fase 4 - Persistencia de DOM pendiente, por ahora inyecta en vivo)
                const newCardHTML = `
                    <div class="card-mini">
                        <button class="edit-card-btn admin-only" onclick="openProductModal('Editar', this)">Editar</button>
                        <div class="card-img-container">
                            <img src="https://images.unsplash.com/photo-1595435934249-5df7ed86e1c0?q=80&w=400" alt="Nuevo">
                            <div class="card-price-tag" data-raw-price="${price}">${formattedPrice}</div>
                        </div>
                        <div class="card-info">
                            <h3 class="card-title">${title}</h3>
                            <p class="card-sizes">${sizeString}</p>
                        </div>
                    </div>
                `;
                document.getElementById('inventory-track').insertAdjacentHTML('beforeend', newCardHTML);
            }
            closeProductModal();
        }

        // --- 4. GUARDADO MAESTRO ---
        function saveAllSettings() {
            const settings = {
                fubBar: document.getElementById('edit-fub-bar').value,
                logoSize: document.getElementById('edit-logo-size').value,
                headerPad: document.getElementById('edit-header-pad').value,
                logoSrc: logoTrigger.dataset.customLogo || logoTrigger.src
            };
            localStorage.setItem('phenom_site_settings', JSON.stringify(settings));
            applySettings(settings);
            
            const toast = document.getElementById('toast-success');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function applySettings(settings) {
            if(settings.fubBar) { 
                document.getElementById('fub-bar').innerText = settings.fubBar; 
                document.getElementById('edit-fub-bar').value = settings.fubBar;
            }
            if(settings.logoSize) {
                logoTrigger.style.height = settings.logoSize + 'px';
                document.getElementById('edit-logo-size').value = settings.logoSize;
            }
            if(settings.headerPad) {
                header.style.padding = `${settings.headerPad}px 40px`;
                document.getElementById('edit-header-pad').value = settings.headerPad;
            }
            if(settings.logoSrc && settings.logoSrc !== window.location.href) {
                logoTrigger.src = settings.logoSrc;
                logoTrigger.dataset.customLogo = settings.logoSrc;
            }
        }

        window.onload = () => {
            const saved = localStorage.getItem('phenom_site_settings');
            if (saved) applySettings(JSON.parse(saved));
            else document.getElementById('edit-fub-bar').value = document.getElementById('fub-bar').innerText;
        };
    </script>
</body>
</html>
