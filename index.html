<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phenom | Tienda Oficial</title>
    <style>
        /* --- RESET Y VARIABLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { overflow-x: hidden; background: #fff; }

        /* --- BARRA SUPERIOR (ANUNCIOS) --- */
        .top-bar {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* --- HEADER PRINCIPAL --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: #fff;
            border-bottom: 1px solid #eaeaea;
        }
        
        /* LOGO CON TRIGGER OCULTO */
        .logo-container img {
            height: 45px;
            cursor: pointer; /* Acá anclaremos los 5 toques */
        }

        /* NAVEGACIÓN CENTRO */
        .nav-links {
            display: flex;
            gap: 25px;
        }
        .nav-links a {
            text-decoration: none;
            color: #000;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: #666; }
        .nav-links a.highlight { color: #e00; } /* El "SALE" en rojo */

        /* ICONOS DERECHA */
        .header-icons {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .search-box {
            background: #f0f0f0;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 13px;
            width: 180px;
            outline: none;
        }
        .icon { font-size: 20px; cursor: pointer; }

        /* --- HERO SECTION (GRILLA 3 COLUMNAS) --- */
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            height: 85vh; /* Ocupa casi toda la pantalla */
        }

        .hero-col {
            position: relative;
            background-color: #111;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
        }

        /* Capa oscura para que el texto resalte */
        .hero-col::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            padding: 20px;
            width: 100%;
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .hero-subtitle {
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        /* BOTÓN DE ACCIÓN */
        .btn-comprar {
            display: inline-flex;
            align-items: center;
            background: #fff;
            color: #000;
            padding: 15px 30px;
            font-weight: 900;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn-comprar:hover {
            background: #000;
            color: #fff;
        }

        /* --- WHATSAPP FLOTANTE --- */
        .wp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #000; /* Fondo negro elegante */
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <div class="top-bar" id="fub-bar">
        ¡BIENVENIDOS A LA TIENDA OFICIAL DE PHENOM!
    </div>

    <!-- HEADER -->
    <header class="header">
        <div class="logo-container">
            <!-- El ID logo-trigger es crucial para la Fase 2 (Los 5 toques) -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/Adidas_Logo.svg/2560px-Adidas_Logo.svg.png" alt="Logo" id="logo-trigger">
        </div>
        
        <nav class="nav-links">
            <a href="#">Guantes</a>
            <a href="#">Protección</a>
            <a href="#">Indumentaria</a>
            <a href="#">Tinas de Recuperación</a>
            <a href="#" class="highlight">Sale</a>
        </nav>

        <div class="header-icons">
            <input type="text" class="search-box" placeholder="Buscar...">
            <span class="icon">👤</span>
            <span class="icon">♡</span>
            <span class="icon">🛒</span>
        </div>
    </header>

    <!-- HERO SECTION (3 COLUMNAS) -->
    <section class="hero-grid">
        
        <!-- Columna 1 -->
        <div class="hero-col" style="background-image: url('https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?q=80&w=800');">
            <div class="hero-content">
                <h1 class="hero-title" id="text-col1-title">PHENOM ELITE</h1>
                <h2 class="hero-subtitle" id="text-col1-sub">MÁXIMA PROTECCIÓN</h2>
                <a href="#" class="btn-comprar">COMPRAR AHORA →</a>
            </div>
        </div>

        <!-- Columna 2 -->
        <div class="hero-col" style="background-image: url('https://images.unsplash.com/photo-1596356453261-0d265eb26d43?q=80&w=800');">
            <div class="hero-content">
                <h1 class="hero-title" id="text-col2-title">THE ORIGINAL</h1>
            </div>
        </div>

        <!-- Columna 3 -->
        <div class="hero-col" style="background-image: url('https://images.unsplash.com/photo-1517438322307-e67111335449?q=80&w=800');">
            <div class="hero-content">
                <h1 class="hero-title" id="text-col3-title">SPARRING PRO</h1>
                <h2 class="hero-subtitle" id="text-col3-sub">ONZAS PRECISAS</h2>
            </div>
        </div>

    </section>

    <!-- WHATSAPP FLOTANTE -->
    <a href="https://wa.me/59800000000" class="wp-float" target="_blank">
        ✆
    </a>

</body>
</html>
